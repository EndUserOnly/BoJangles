name: Build and qualify BoJangles update
on:
  push:
    branches: [main]
    paths: ['src/**', 'native/**', 'tests/**', 'ci/**', '.github/workflows/build-update.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bojangles-update-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Verify published inputs and prepare source
        run: python3 ci/build_update.py prepare
      - name: Install declared runner dependencies
        run: |
          sudo apt-get update
          xargs -a ci-work/apt-packages.txt sudo apt-get install -y --no-install-recommends
      - name: Prepare pinned compiler
        run: python3 ci/build_update.py bootstrap
      - name: Compile bounded native broker
        run: python3 ci/build_update.py broker
      - name: Permit the CI sandbox launcher to create user namespaces
        run: |
          # Ubuntu documents this narrowly attached profile for sandbox launchers.
          # Keep the global namespace restriction and all product sandboxing intact.
          sudo tee /etc/apparmor.d/bojangles-ci-bwrap >/dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile bojangles-ci-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser -r /etc/apparmor.d/bojangles-ci-bwrap
          bwrap --unshare-all --ro-bind / / -- /usr/bin/true
      - name: Run isolated source and native regressions
        run: python3 ci/build_update.py tests
      - name: Compile standalone application with four jobs
        run: python3 ci/build_update.py compile
      - name: Retain the successful compilation for packaging recovery
        uses: actions/upload-artifact@v4
        with:
          name: bojangles-compiled-inputs
          path: |
            ci-work/builder/bojangles-app-output/bojangles.dist/
            ci-work/builder/bojangles-app-compilation.xml
            ci-work/release/
            ci-work/source/src/
            ci-work/source/requirements-build.txt
            ci-work/input-record.json
            ci-work/native-build.json
          retention-days: 2
      - name: Qualify complete archive and native updater extraction
        run: python3 ci/build_update.py package
      - name: Retain qualification output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bojangles-header-bookmark-update
          path: ci-work/artifacts/
          retention-days: 7
      - name: Publish qualified update assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.0-header-bookmarks.20261030 \
            --target "$GITHUB_SHA" --prerelease \
            --title "BoJangles — bounded headers and bookmark visibility" \
            --notes "GitHub-built updater test release. Fixes HTTP response header rejection and cross-browser bookmark visibility. Complete native application, corresponding source, checksums and validation are included. No site-specific repairs or launch wrappers. Playback and authenticated WordPress use remain owner tests. The signed feed is published separately after verifying these assets." \
            ci-work/artifacts/*
